name: Daily miss-day reminder

on:
  schedule:
    # 02:00 UTC ≈ 8:00pm America/Denver during MDT (UTC-6).
    # During MST (UTC-7) this is 7:00pm. See README for nuance.
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Send reminder if check-in missing
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REMINDER_TO_EMAIL: ${{ secrets.REMINDER_TO_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          PAGES_URL: ${{ secrets.PAGES_URL }}
        run: node scripts/send-reminder.mjs
