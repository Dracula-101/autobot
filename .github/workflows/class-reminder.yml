name: Class reminder (90m before first lecture)

on:
  schedule:
    # Hourly Tue/Thu during Boulder morning→noon UTC windows covering MDT/MST
    # Script no-ops outside the 20-min window starting 90m before 12:30 Denver.
    - cron: '5 16,17,18 * * 2,4'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Send class reminder if in window
        env:
          REMINDER_TO_EMAIL: ${{ secrets.REMINDER_TO_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          PAGES_URL: ${{ secrets.PAGES_URL }}
        run: node scripts/send-class-reminder.mjs
